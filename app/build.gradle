apply plugin: 'com.android.application'
apply plugin: 'realm-android'


android {
    namespace "com.ar.salata"
    compileSdk 34
    buildToolsVersion "34.0.0"
    ndkVersion  "21.0.6113669"

    defaultConfig {
        applicationId "com.ar.salata"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 10
        versionName "1.10"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }

}

repositories {
    mavenCentral()
    google()
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.recyclerview:recyclerview-selection:1.2.0"
    implementation 'androidx.gridlayout:gridlayout:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation fileTree(dir: 'D:\\Android_Projects\\Salata\\android\\salata-android-app\\app\\libs', include: ['*.aar', '*.jar'], exclude: [])
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.smarteist:autoimageslider:1.3.5'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'
    implementation "androidx.fragment:fragment:1.8.8"
    implementation 'com.squareup.retrofit2:retrofit:2.8.1'
    implementation "com.squareup.retrofit2:converter-gson:2.7.2"
    implementation 'com.squareup.okhttp3:logging-interceptor:4.5.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.9.1"
    implementation "androidx.lifecycle:lifecycle-livedata:2.9.1"

    // Opay
    implementation(name: 'cashier-sdk-1.1.2', ext: 'aar')
    implementation fileTree(dir: 'libs', include: ['*.jar'])

}
